<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe26a"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="cardShadow" x="110" y="70" width="580" height="440" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#4e2f51" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#cardShadow)">
    <rect x="135" y="90" width="530" height="400" rx="28" fill="#fffafc" stroke="#ffffff" stroke-width="4"/>
  </g>
  <!-- Sticker 1: Pixel Gamepad -->
  <g transform="translate(245 200) rotate(-6)">
    <rect x="-56" y="-42" width="112" height="84" rx="26" fill="#4e2f51" stroke="#ffffff" stroke-width="6"/>
    <rect x="-32" y="-6" width="24" height="8" rx="2" fill="#f9a8d4"/>
    <rect x="-24" y="-14" width="8" height="24" rx="2" fill="#f9a8d4"/>
    <circle cx="20" cy="-8" r="6" fill="#62e3f5"/>
    <circle cx="32" cy="4" r="6" fill="#ffe26a"/>
  </g>
  <!-- Sticker 2: CGD Cube -->
  <g transform="translate(400 195) rotate(4)">
    <polygon points="0,-50 44,-25 44,25 0,50 -44,25 -44,-25" fill="#ec4899" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-50 44,-25 0,0 -44,-25" fill="#f9a8d4"/>
    <polygon points="0,0 44,-25 44,25 0,50" fill="#be185d"/>
  </g>
  <!-- Sticker 3: Heart -->
  <g transform="translate(555 200) rotate(8)">
    <circle cx="0" cy="0" r="46" fill="#ff758c" stroke="#ffffff" stroke-width="6"/>
    <path d="M0 22 C-22 6 -26 -14 -12 -20 C-4 -23 0 -14 0 -14 C0 -14 4 -23 12 -20 C26 -14 22 6 0 22 Z" fill="#fdf2f4"/>
  </g>
  <!-- Sticker 4: Pixel Trophy -->
  <g transform="translate(245 365) rotate(5)">
    <rect x="-50" y="-42" width="100" height="84" rx="22" fill="#ffe26a" stroke="#ffffff" stroke-width="6"/>
    <path d="M-22 -22 H22 V-4 C22 10 12 18 0 18 C-12 18 -22 10 -22 -4 Z" fill="#4e2f51"/>
    <rect x="-6" y="16" width="12" height="12" fill="#4e2f51"/>
    <rect x="-18" y="26" width="36" height="8" rx="3" fill="#4e2f51"/>
  </g>
  <!-- Sticker 5: JAM Badge -->
  <g transform="translate(400 368) rotate(-4)">
    <rect x="-64" y="-34" width="128" height="68" rx="34" fill="#62e3f5" stroke="#ffffff" stroke-width="6"/>
    <text x="0" y="7" text-anchor="middle" fill="#4e2f51" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="2">WEAR JAM</text>
  </g>
  <!-- Sticker 6: Starburst -->
  <g transform="translate(555 365) rotate(-7)">
    <rect x="-46" y="-46" width="92" height="92" rx="24" fill="#770b75" stroke="#ffffff" stroke-width="6"/>
    <polygon points="0,-24 7,-8 24,-8 10,3 15,20 0,10 -15,20 -10,3 -24,-8 -7,-8" fill="#ffe26a"/>
  </g>
  <rect x="305" y="530" width="190" height="36" rx="18" fill="#ffffff" fill-opacity="0.88"/>
  <text x="400" y="553" text-anchor="middle" fill="#4e2f51" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5">6-STICKER SET</text>
</svg>
